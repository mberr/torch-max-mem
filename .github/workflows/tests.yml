# This file configures the continuous integration (CI) system on GitHub.
# Introductory materials can be found here: https://docs.github.com/en/actions/learn-github-actions/understanding-github-actions.
# Documentation for editing this file can be found here: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Tests

# by default, give the GITHUB_TOKEN read-only access to the repository contents,
# which is the only permission any job below requires
# See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # lint/pyroma only inspect static config and source text, so their result
        # is the same regardless of interpreter version; only run them once.
        # mypy's output does depend on the Python version's typeshed stubs, so
        # it is checked across the full supported range.
        include:
          - python-version: "3.14"
            tox-command: "lint"
          - python-version: "3.14"
            tox-command: "pyroma"
          - python-version: "3.14"
            tox-command: "mypy"
          - python-version: "3.10"
            tox-command: "mypy"
    steps:
      - uses: actions/checkout@v4
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v3"
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: "Run command"
        run: |
          uvx -p ${{ matrix.python-version }} --with tox-uv tox -e ${{ matrix.tox-command }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # We only test documentation on the latest version
        tox-command: [ "docs-lint", "docstr-coverage", "docs-test", "lint-markdown" ]
    steps:
      - uses: actions/checkout@v4
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v3"
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install graphviz
        # only the Sphinx build needs it
        if: matrix.tox-command == 'docs-test'
        run: sudo apt-get install graphviz
      - name: "Run command"
        run: uvx -p 3.14 --with tox-uv tox -e ${{ matrix.tox-command }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14", "3.10" ]
    steps:
      - uses: actions/checkout@v4
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v3"
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Test with pytest and generate coverage file
        run:
          uvx -p ${{ matrix.python-version }} --with tox-uv tox -e py
      - name: Run doctests
        run:
          uvx -p ${{ matrix.python-version }} --with tox-uv tox -e doctests
      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
