# This file configures the continuous integration (CI) system on GitHub.
# Introductory materials can be found here: https://docs.github.com/en/actions/learn-github-actions/understanding-github-actions.
# Documentation for editing this file can be found here: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Tests

# by default, give the GITHUB_TOKEN read-only access to the repository contents,
# which is the only permission any job below requires
# See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Run ruff
        run: uvx -p 3.14 --with tox-uv tox -e lint

  pyroma:
    name: Pyroma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Run pyroma
        run: uvx -p 3.14 --with tox-uv tox -e pyroma

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # mypy's output depends on the Python version's typeshed stubs,
        # so it is checked across the full supported range
        python-version: [ "3.14", "3.10" ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Run mypy
        run: uvx -p ${{ matrix.python-version }} --with tox-uv tox -e mypy

  docs-lint:
    name: "Docs: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Lint documentation
        run: uvx -p 3.14 --with tox-uv tox -e docs-lint

  docstr-coverage:
    name: "Docs: Docstring Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Check docstring coverage
        run: uvx -p 3.14 --with tox-uv tox -e docstr-coverage

  docs-test:
    name: "Docs: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Install graphviz
        run: sudo apt-get install graphviz
      - name: Check documentation build with Sphinx
        run: uvx -p 3.14 --with tox-uv tox -e docs-test

  lint-markdown:
    name: "Docs: Lint Markdown"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Lint markdown
        run: uvx -p 3.14 --with tox-uv tox -e lint-markdown

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14", "3.10" ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv-python
      - name: Test with pytest and generate coverage file
        run:
          uvx -p ${{ matrix.python-version }} --with tox-uv tox -e py
      - name: Run doctests
        run:
          uvx -p ${{ matrix.python-version }} --with tox-uv tox -e doctests
      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
